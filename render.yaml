services:
  - type: web
    name: call-analytics-admin-api
    env: node
    rootDir: admin
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
